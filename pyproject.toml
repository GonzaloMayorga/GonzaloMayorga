[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "github-profile-card"
version = "1.0.0"
description = "Generate a terminal-inspired SVG card for a GitHub profile."
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
dependencies = [
    "Jinja2>=3.1,<4.0",
    "httpx>=0.28,<1.0",
    "Pillow>=11.0,<12.0",
    "rembg[cpu]>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[project.scripts]
profile-card = "profile_card.main:main"

[tool.setuptools.packages.find]
where = ["src"]
